name: "Build container image"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
  schedule:
    - cron: "38 4 * * 0,4"

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest

    container:
      image: quay.io/podman/stable:v5.8.4-immutable@sha256:b0173238dceedf46a10d2c3a7bf9b217a85dce19706d2d9c80b01345839ae779
      options: --privileged

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install skopeo and rpm-ostree
        run: dnf install -y skopeo rpm-ostree

      - name: Configure containers storage on /mnt
        run: |
          mkdir -p /mnt/containers/storage
          cat > /etc/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/mnt/containers/storage/runroot"
          graphroot = "/mnt/containers/storage/graphroot"
          [storage.options.overlay]
          mountopt = "nodev,metacopy=on"
          EOF
          podman system reset -f || true

      - name: Set variables
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${GITHUB_SHA:0:7}
          K0S_VERSION=$(sed -ne 's|ARG K0S_VERSION\=v\(.*\)|\1|p' Containerfile | tr + -)
          K8S_VERSION=$(echo "$K0S_VERSION" | cut -d "-" -f 1)
          K8S_VERSION_MINOR=$(echo "$K8S_VERSION" | cut -d "." -f 1-2)
          VERSION=$K0S_VERSION-$SHORT_SHA

          cat >> "$GITHUB_ENV"<< ENV
          IMAGE_NAME=$IMAGE_NAME
          SHORT_SHA=$SHORT_SHA
          K0S_VERSION=$K0S_VERSION
          K8S_VERSION=$K8S_VERSION
          K8S_VERSION_MINOR=$K8S_VERSION_MINOR
          VERSION=$VERSION
          ENV

      - name: Github registry login
        run: podman login -u "${{ github.repository_owner }}" -p "${{ secrets.GITHUB_TOKEN }}" "ghcr.io"

      - name: Build raw image
        run: |
          podman build -t "$IMAGE_NAME:raw" \
                  --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
                  --label org.opencontainers.image.version="${VERSION}" .

      - name: Rechunk image
        run: |
          set -euo pipefail
          rpm-ostree experimental compose build-chunked-oci \
              --bootc \
              --format-version=1 \
              --from="$IMAGE_NAME:raw" \
              --output containers-storage:"$IMAGE_NAME"

      - name: "Warm up github registry layer cache (podman bug #27796)"
        run: |
          podman push "$IMAGE_NAME" "docker://$IMAGE_NAME:$SHORT_SHA"

      - name: Push dev image to github registry
        if: github.ref != 'refs/heads/main'
        run: |
          podman push "$IMAGE_NAME" "docker://$IMAGE_NAME:$VERSION"
          podman push "$IMAGE_NAME" "docker://$IMAGE_NAME:dev"

      - name: Push image to github registry
        if: github.ref == 'refs/heads/main'
        run: |
          podman push "$IMAGE_NAME" "docker://$IMAGE_NAME:${K0S_VERSION}"
          podman push "$IMAGE_NAME" "docker://$IMAGE_NAME:${K8S_VERSION}"
          podman push "$IMAGE_NAME" "docker://$IMAGE_NAME:${K8S_VERSION_MINOR}"
          podman push "$IMAGE_NAME" "docker://$IMAGE_NAME:latest"
